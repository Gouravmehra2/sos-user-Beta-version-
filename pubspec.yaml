name: squadonsite
description: "SquadOnSite Flutter application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  uuid: ^4.5.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_svg: ^2.3.0
  get: ^4.7.3
  persistent_bottom_nav_bar: ^6.2.1
  country_code_picker: ^3.0.0
  google_sign_in: ^7.1.1
  sign_in_with_apple: ^8.2.0
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  google_maps_flutter: ^2.17.1
  carousel_slider: ^5.0.0
  video_player: ^2.11.1
  dotted_border: ^3.1.0
  easy_date_timeline: ^2.0.9
  image_picker: ^1.1.2
  dio: ^5.9.0
  http: ^1.4.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.3.1
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^19.4.0
  flutter_stripe: ^14.2.0
  socket_io_client: ^2.0.3+1
  package_info_plus: ^10.2.1
  lottie: ^3.6.1
  readmore: ^3.0.0
  html: ^0.15.7
  pdf: ^3.12.0
  printing: ^5.14.3
  url_launcher: ^6.3.3
  firebase_auth: ^6.7.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Pins google_sign_in_android to 7.1.0 to avoid the ResultUtilsKt
# compilation error present in 7.2.x. Remove once a fixed 7.2.x is released.
dependency_overrides:
  google_sign_in_android: 7.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/html/privacy_policy.html
    - assets/html/terms_conditions.html

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_regular.ttf
          weight: 400
        - asset: assets/fonts/inter_medium.ttf
          weight: 500
        - asset: assets/fonts/inter_semi_bold.ttf
          weight: 600
        - asset: assets/fonts/inter_bold.ttf
          weight: 700
